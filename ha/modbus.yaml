# ไฟล์ที่ 1/3 — รวมเข้า hub Modbus เดิม (อย่าเปิด TCP ซ้ำ)
# เปลี่ยน `hub: erv` ในสคริปต์ให้ตรงกับ name ของ hub นี้
#
# จุดที่ขาด: สวิตช์ Power ที่ holding address 1 (slave 2)
# write_type: holdings = FC16 เพราะบอร์ด ERV หลายรุ่นไม่รับ FC06

    switches:
      - name: "ERV U2 Power"
        unique_id: erv_u2_power
        slave: 2
        address: 1
        write_type: holdings
        command_on: 1
        command_off: 0
        scan_interval: 5
        verify:
          input_type: holding
          address: 1
          delay: 1
          state_on: 1
          state_off: 0

    sensors:
      - name: "ERV U2 Mode"
        unique_id: erv_u2_mode
        slave: 2
        address: 2
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: "ERV U2 Air"
        unique_id: erv_u2_air
        slave: 2
        address: 3
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: "ERV U2 Remain Hours"
        unique_id: erv_u2_remain_hours
        slave: 2
        address: 11
        input_type: holding
        data_type: uint16
        scan_interval: 60

      - name: "ERV U2 Replace Hours"
        unique_id: erv_u2_replace_hours
        slave: 2
        address: 13
        input_type: holding
        data_type: uint16
        scan_interval: 60
