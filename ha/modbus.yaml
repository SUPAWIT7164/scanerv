      scale: 0.1
      offset: 0
      precision: 1
      temperature_unit: C
      max_temp: 30
      min_temp: 16
      temp_step: 0.5
      target_temp_register: 4
      hvac_onoff_register: 0
      write_registers: true
      hvac_mode_register:
        address: 1
        values:
          state_auto: 0
          state_heat: 1
          state_dry: 2
          state_fan_only: 3
          state_cool: 4
