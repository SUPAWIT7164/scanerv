#############################################
#  MODBUS – ERV HF5111SC (U1-U4)
#############################################
# จุดที่ทำให้กด Power ไม่ติด: write_type: holding = FC06
# บอร์ด ERV รับแบบเดียวกับ Intesis คือ FC16 → ต้องเป็น holdings
# แล้ว Restart Home Assistant
- name: "ERV"
  type: tcp
  host: "172.17.24.160"
  port: 8899
  # ของเดิม delay: 5  timeout: 10  retries: 5
  # ถ้า U1/U3/U4 ไม่ตอบ: timeout×retries ต่อเซ็นเซอร์ → คำสั่ง Power ต่อคิวช้าหลายนาที
  delay: 0
  timeout: 1
  retries: 0
  message_wait_milliseconds: 150

  #################################
  # SWITCHES
  #################################
  switches:

    # ===== U1 =====
    - name: "ERV U1 Power"
      slave: 1
      address: 1
      write_type: holdings
      command_on: 1
      command_off: 0
      scan_interval: 5
      verify:
        input_type: holding
        address: 1
        state_on: 1
        state_off: 0
    # ===== U2 =====
    - name: "ERV U2 Power"
      slave: 2
      address: 1
      write_type: holdings
      command_on: 1
      command_off: 0
      scan_interval: 5
      verify:
        input_type: holding
        address: 1
        state_on: 1
        state_off: 0
    # ===== U3 =====
    - name: "ERV U3 Power"
      slave: 3
      address: 1
      write_type: holdings
      command_on: 1
      command_off: 0
      scan_interval: 5
      verify:
        input_type: holding
        address: 1
        state_on: 1
        state_off: 0
    # ===== U4 =====
    - name: "ERV U4 Power"
      slave: 4
      address: 1
      write_type: holdings
      command_on: 1
      command_off: 0
      scan_interval: 5
      verify:
        input_type: holding
        address: 1
        state_on: 1
        state_off: 0

  #################################
  # SENSORS
  #################################
  sensors:

    #################################
    # ===== U1 =====
    #################################
    - name: "ERV U1 Mode"
      slave: 1
      address: 2
      input_type: holding
      data_type: uint16
      scan_interval: 30

    - name: "ERV U1 Air"
      slave: 1
      address: 3
      input_type: holding
      data_type: uint16
      scan_interval: 30

    - name: "ERV U1 Remain Hours"
      slave: 1
      address: 11
      input_type: holding
      data_type: uint16
      scan_interval: 180

    - name: "ERV U1 Replace Hours"
      slave: 1
      address: 13
      input_type: holding
      data_type: uint16
      scan_interval: 180
    #################################
    # ===== U2 =====
    #################################
    - name: "ERV U2 Mode"
      slave: 2
      address: 2
      input_type: holding
      data_type: uint16
      scan_interval: 30

    - name: "ERV U2 Air"
      slave: 2
      address: 3
      input_type: holding
      data_type: uint16
      scan_interval: 30

    - name: "ERV U2 Remain Hours"
      slave: 2
