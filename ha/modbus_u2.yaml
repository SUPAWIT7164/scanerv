# Merge into the SAME Modbus hub that already talks to HF5111SC
# (172.17.24.160:8899). Do NOT add a second TCP hub — the gateway is
# single-client. Hub `name:` MUST match scripts (default: erv).
#
# Why Power did nothing ("กด power แล้วไม่ทำงาน"):
# - U2 YAML had Mode (addr 2) and Air (addr 3) as sensors only.
# - The dashboard toggles switch.erv_u2_power, which did not exist.
# - A Power *sensor* would be sensor.erv_u2_power and toggle would fail silently.
# - write_type: holdings = FC16. Default holding = FC06; many ERVs ignore FC06.
# - scan_interval: 5 so the UI updates after a write (30s looks like "broken").
#
# Paste the switch under `switches:` (create that key if missing). Keep your
# existing Mode/Air/hours sensors; do not add a Power sensor (the switch
# already polls holding register 1). Restart Home Assistant after paste.

    switches:
      - name: "ERV U2 Power"
        unique_id: erv_u2_power
        slave: 2
        address: 1
        write_type: holdings
        command_on: 1
        command_off: 0
        scan_interval: 5
        verify:
          input_type: holding
          address: 1
          delay: 1
          state_on: 1
          state_off: 0

    sensors:
      # Existing U2 sensors (merge if you already have them). Power is the switch.
      - name: "ERV U2 Mode"
        unique_id: erv_u2_mode
        slave: 2
        address: 2
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: "ERV U2 Air"
        unique_id: erv_u2_air
        slave: 2
        address: 3
        input_type: holding
        data_type: uint16
        scan_interval: 30

      - name: "ERV U2 Remain Hours"
        unique_id: erv_u2_remain_hours
        slave: 2
        address: 11
        input_type: holding
        data_type: uint16
        scan_interval: 60

      - name: "ERV U2 Replace Hours"
        unique_id: erv_u2_replace_hours
        slave: 2
        address: 13
        input_type: holding
        data_type: uint16
        scan_interval: 60
