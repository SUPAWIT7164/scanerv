# ไฟล์ที่ 2/3 — วางใน scripts.yaml แล้ว Restart Home Assistant
# `hub: ERV` ต้องตรงกับชื่อ hub ในไฟล์ Modbus
# `value: [n]` เป็นลิสต์ เพื่อให้ HA ส่ง FC16 (บอร์ด ERV มักไม่รับ FC06)

script:
  erv_u2_power_on:
    alias: ERV U2 Power On
    mode: single
    sequence:
      - service: modbus.write_register
        data:
          hub: ERV
          slave: 2
          address: 1
          value: [1]

  erv_u2_power_off:
    alias: ERV U2 Power Off
    mode: single
    sequence:
      - service: modbus.write_register
        data:
          hub: ERV
          slave: 2
          address: 1
          value: [0]

  erv_u2_power_toggle:
    alias: ERV U2 Power Toggle
    mode: single
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: switch.erv_u2_power
                state: "on"
            sequence:
              - service: script.erv_u2_power_off
        default:
          - service: script.erv_u2_power_on

  erv_u2_mode_heat:
    alias: ERV U2 Mode Heat-Exchange
    mode: single
    sequence:
      - service: modbus.write_register
        data:
          hub: ERV
          slave: 2
          address: 2
          value: [0]

  erv_u2_mode_normal:
    alias: ERV U2 Mode Normal
    mode: single
    sequence:
      - service: modbus.write_register
        data:
          hub: ERV
          slave: 2
          address: 2
          value: [1]

  erv_u2_air_low:
    alias: ERV U2 Air Low
    mode: single
    sequence:
      - service: modbus.write_register
        data:
          hub: ERV
          slave: 2
          address: 3
          value: [1]

  erv_u2_air_high:
    alias: ERV U2 Air High
    mode: single
    sequence:
      - service: modbus.write_register
        data:
          hub: ERV
          slave: 2
          address: 3
          value: [3]
