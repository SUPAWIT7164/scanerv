# OPTIONAL fallback only. Skip this file if ha/modbus_u2.yaml is loaded —
# that already creates switch.erv_u2_power.
#
# This entity_id is switch.erv_u2_power_script so it does not collide with
# the native Modbus switch. Point a card at it only if you cannot use the
# native switch (for example the hub rejects switch writes but scripts work).

template:
  - switch:
      - name: ERV U2 Power Script
        unique_id: erv_u2_power_script
        state: "{{ is_state('switch.erv_u2_power', 'on') }}"
        turn_on:
          - service: script.erv_u2_power_on
        turn_off:
          - service: script.erv_u2_power_off
