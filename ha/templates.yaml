# Paste under `template:`. Restart Home Assistant after paste.
# Fan Speed card uses sensor.erv_u2_air_label.

template:
  - sensor:
      - name: ERV U2 Air Label
        unique_id: erv_u2_air_label
        state: >
          {% set v = states('sensor.erv_u2_air') %}
          {% if v == '1' %}Low
          {% elif v == '3' %}High
          {% else %}{{ v }}
          {% endif %}

      - name: ERV U2 Mode Label
        unique_id: erv_u2_mode_label
        state: >
          {% set v = states('sensor.erv_u2_mode') %}
          {% if v == '0' %}Heat-Exchange
          {% elif v == '1' %}Normal
          {% else %}{{ v }}
          {% endif %}
