# Lovelace card for ERV 2. Paste into a dashboard (raw YAML).
# Power uses call-service with an explicit target, same pattern as Mode/Air.
# mushroom-template-card `action: toggle` is unreliable and was why Power
# appeared to do nothing even after the switch exists.
#
# Requires: switch.erv_u2_power (ha/modbus_u2.yaml), scripts in ha/scripts_u2.yaml,
# and sensor.erv_u2_air_label (ha/templates_u2.yaml). Restart HA after YAML changes.

type: vertical-stack
cards:
  - type: custom:mushroom-title-card
    title: 🌀 ERV 2
    subtitle: ควบคุมพัดลมระบายอากาศ
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        entity: switch.erv_u2_power
        primary: Power
        secondary: |
          {{ 'ON' if is_state('switch.erv_u2_power', 'on') else 'OFF' }}
        icon: mdi:power
        layout: vertical
        icon_color: |
          {% if is_state('switch.erv_u2_power', 'on') %}
            green
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: call-service
          service: switch.toggle
          target:
            entity_id: switch.erv_u2_power
        icon_tap_action:
          action: call-service
          service: switch.toggle
          target:
            entity_id: switch.erv_u2_power
        hold_action:
          action: more-info
        fill_container: true
      - type: custom:mushroom-template-card
        entity: sensor.erv_u2_air_label
        primary: Fan Speed
        secondary: "{{ states('sensor.erv_u2_air_label') }}"
        icon: mdi:fan
        layout: vertical
        icon_color: |
          {% set v = states('sensor.erv_u2_air_label') %}
          {% if v == 'High' %}
            orange
          {% elif v == 'Low' %}
            cyan
          {% else %}
            grey
          {% endif %}
        hold_action:
          action: more-info
        fill_container: true
  - type: conditional
    conditions:
      - entity: switch.erv_u2_power
        state: "on"
    card:
      type: vertical-stack
      cards:
        - type: horizontal-stack
          cards:
            - type: custom:button-card
              entity: sensor.erv_u2_mode
              name: Heat
              label: รับลมใหม่พร้อมรักษาความเย็น
              show_label: true
              icon: mdi:heat-wave
              tap_action:
                action: call-service
                service: script.erv_u2_mode_heat
              hold_action:
                action: more-info
              styles:
                card:
                  - padding: 8px 12px
                  - border-radius: 14px
                  - box-shadow: 0 2px 8px rgba(0,0,0,.15)
                  - margin-top: 4px
                  - background-color: |
                      [[[
                        return entity.state == '0'
                          ? '#ffe7d9'
                          : 'var(--ha-card-background)';
                      ]]]
                icon:
                  - width: 24px
                  - height: 24px
                  - color: |
                      [[[
                        return entity.state == '0'
                          ? '#ff7043'
                          : '#808080';
                      ]]]
                name:
                  - font-size: 13px
                  - color: |
                      [[[
                        return entity.state == '0'
                          ? '#ff7043'
                          : '#808080';
                      ]]]
                  - font-weight: |
                      [[[
                        return entity.state == '0'
                          ? '700'
                          : '400';
                      ]]]
                label:
                  - font-size: 11px
                  - color: "#666"
            - type: custom:button-card
              entity: sensor.erv_u2_mode
              name: Normal
              label: รับลมใหม่ / ระบายอากาศเสีย
              show_label: true
              icon: mdi:weather-windy
              tap_action:
                action: call-service
                service: script.erv_u2_mode_normal
              hold_action:
                action: more-info
              styles:
                card:
                  - padding: 8px 12px
                  - border-radius: 14px
                  - box-shadow: 0 2px 8px rgba(0,0,0,.15)
                  - margin-top: 4px
                  - background-color: |
                      [[[
                        return entity.state == '1'
                          ? '#e3f2fd'
                          : 'var(--ha-card-background)';
                      ]]]
                icon:
                  - width: 24px
                  - height: 24px
                  - color: |
                      [[[
                        return entity.state == '1'
                          ? '#42a5f5'
                          : '#808080';
                      ]]]
                name:
                  - font-size: 13px
                  - color: |
                      [[[
                        return entity.state == '1'
                          ? '#42a5f5'
                          : '#808080';
                      ]]]
                  - font-weight: |
                      [[[
                        return entity.state == '1'
                          ? '700'
                          : '400';
                      ]]]
                label:
                  - font-size: 11px
                  - color: "#666"
        - type: custom:button-card
          entity: sensor.erv_u2_air
          name: Low
          label: ลมเบา ประหยัดพลังงาน
          show_label: true
          icon: mdi:fan-speed-1
          tap_action:
            action: call-service
            service: script.erv_u2_air_low
          hold_action:
            action: more-info
          styles:
            card:
              - padding: 10px 14px
              - border-radius: 14px
              - box-shadow: 0 2px 8px rgba(0,0,0,.15)
              - margin-bottom: 8px
              - background-color: |
                  [[[
                    return entity.state == '1'
                      ? '#e0f7fa'
                      : 'var(--ha-card-background)';
                  ]]]
            icon:
              - width: 28px
              - height: 28px
              - color: |
                  [[[
                    return entity.state == '1'
                      ? '#00bcd4'
                      : '#808080';
                  ]]]
            name:
              - font-size: 14px
              - color: |
                  [[[
                    return entity.state == '1'
                      ? '#00bcd4'
                      : '#808080';
                  ]]]
              - font-weight: |
                  [[[
                    return entity.state == '1'
                      ? '700'
                      : '400';
                  ]]]
            label:
              - font-size: 11px
              - color: "#666"
        - type: custom:button-card
          entity: sensor.erv_u2_air
          name: High
          label: ลมแรง ระบายอากาศเร็ว
          show_label: true
          icon: mdi:fan-speed-3
          tap_action:
            action: call-service
            service: script.erv_u2_air_high
          hold_action:
            action: more-info
          styles:
            card:
              - padding: 10px 14px
              - border-radius: 14px
              - box-shadow: 0 2px 8px rgba(0,0,0,.15)
              - background-color: |
                  [[[
                    return entity.state == '3'
                      ? '#ffe7d9'
                      : 'var(--ha-card-background)';
                  ]]]
            icon:
              - width: 28px
              - height: 28px
              - color: |
                  [[[
                    return entity.state == '3'
                      ? '#ff7043'
                      : '#808080';
                  ]]]
            name:
              - font-size: 14px
              - color: |
                  [[[
                    return entity.state == '3'
                      ? '#ff7043'
                      : '#808080';
                  ]]]
              - font-weight: |
                  [[[
                    return entity.state == '3'
                      ? '700'
                      : '400';
                  ]]]
            label:
              - font-size: 11px
              - color: "#666"
