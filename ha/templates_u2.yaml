# Optional labels for the dashboard. Paste under template: (HA 2023+).
# Do not create a Power sensor — use switch.erv_u2_power from ha/modbus_u2.yaml.

template:
  - sensor:
      - name: "ERV U2 Air Label"
        unique_id: erv_u2_air_label
        state: >
          {% set v = states('sensor.erv_u2_air') %}
          {% if v == '1' %}
            Low
          {% elif v == '3' %}
            High
          {% else %}
            {{ v }}
          {% endif %}

      - name: "ERV U2 Mode Label"
        unique_id: erv_u2_mode_label
        state: >
          {% set v = states('sensor.erv_u2_mode') %}
          {% if v == '0' %}
            Heat-Exchange
          {% elif v == '1' %}
            Normal
          {% else %}
            {{ v }}
          {% endif %}
